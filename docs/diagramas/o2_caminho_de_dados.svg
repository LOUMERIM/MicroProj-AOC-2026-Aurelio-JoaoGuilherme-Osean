<text x="980.0" y="495.2" text-anchor="middle" font-size="15" fill="#14213D">(alu_op)</text>
<path d="M1030,480 L1090,480" fill="none" stroke="#14213D" stroke-width="2" marker-end="url(#ah)"/>
