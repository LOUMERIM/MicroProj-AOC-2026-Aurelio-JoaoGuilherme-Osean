<text x="1245.0" y="480.4" text-anchor="middle" font-size="14" font-weight="bold" fill="#14213D">Memória de</text>
<text x="1245.0" y="499.4" text-anchor="middle" font-size="14" fill="#14213D">dados</text>
<text x="1188" y="454" text-anchor="start" font-size="11" fill="#1F5FB0">endereço</text>
<text x="1188" y="544" text-anchor="start" font-size="11" fill="#1F5FB0">write_data</text>
