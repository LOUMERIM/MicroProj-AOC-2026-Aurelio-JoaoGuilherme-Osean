<text x="655" y="432" text-anchor="middle" font-size="13" fill="#14213D">rs_value</text>
<path d="M590,510 L720,510" fill="none" stroke="#14213D" stroke-width="2" marker-end="url(#ah)"/>
<text x="655" y="502" text-anchor="middle" font-size="13" fill="#14213D">rt_value</text>
<rect x="850" y="200" width="180" height="70" rx="8" fill="#E4F1E4" stroke="#2E7D32" stroke-width="2"/>
