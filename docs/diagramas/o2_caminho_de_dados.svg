<text x="515.0" y="494.4" text-anchor="middle" font-size="14" fill="#14213D">registradores</text>
<text x="450" y="538" text-anchor="start" font-size="11" fill="#1F5FB0">leitura combinacional</text>
<text x="450" y="553" text-anchor="start" font-size="11" fill="#1F5FB0">escrita na descida</text>
<path d="M370,440 L440,440" fill="none" stroke="#14213D" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="405" y="432" text-anchor="middle" font-size="13" fill="#14213D">rs</text>
<path d="M370,510 L440,510" fill="none" stroke="#14213D" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="405" y="502" text-anchor="middle" font-size="13" fill="#14213D">rt</text>
