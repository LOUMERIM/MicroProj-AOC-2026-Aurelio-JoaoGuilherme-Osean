<text x="515.0" y="240.2" text-anchor="middle" font-size="15" fill="#14213D">PC + 4</text>
<path d="M370,235 L440,235" fill="none" stroke="#14213D" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="405" y="227" text-anchor="middle" font-size="13" fill="#14213D">pc</text>
<path d="M590,235 L720,235" fill="none" stroke="#14213D" stroke-width="2" marker-end="url(#ah)"/>
<text x="655" y="227" text-anchor="middle" font-size="13" fill="#14213D">pc_plus4</text>
