<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="24" y="30" font-size="21" font-weight="bold" fill="#14213D">Caminho de dados da O2 — pipeline de 5 estágios (sem forwarding, stall nem flush)</text>
