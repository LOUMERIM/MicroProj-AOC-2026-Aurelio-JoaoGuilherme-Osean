<text x="870" y="292" text-anchor="start" font-size="12" fill="#555" font-style="italic">somador de alvo em EX; o PC não é</text>
<text x="870" y="308" text-anchor="start" font-size="12" fill="#555" font-style="italic">redirecionado (aborto por controle)</text>
