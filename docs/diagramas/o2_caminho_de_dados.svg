<text x="1024" y="650" text-anchor="middle" font-size="13" fill="#C62828">zero</text>
<path d="M1260,785 L1330,785" fill="none" stroke="#C62828" stroke-width="2" marker-end="url(#ad)"/>
<text x="1338" y="775" text-anchor="start" font-size="14" fill="#C62828" font-weight="bold">hazard_abort</text>
<text x="1338" y="793" text-anchor="start" font-size="13" fill="#C62828">hazard_type · hazard_pc · hazard_cycle</text>
<text x="560" y="845" text-anchor="start" font-size="13" fill="#C62828" font-style="italic">frozen: congela PC, registradores entre estágios, banco e memória até o reset</text>
<text x="30" y="882" text-anchor="start" font-size="17" fill="#14213D" font-weight="bold">Campos dos registradores entre estágios (largura em bits, lida de vhdl/o2_pkg.vhd)</text>
<rect x="30" y="898" width="390" height="118" rx="8" fill="#FCE3D6" stroke="#B8421A" stroke-width="2"/>
<text x="42" y="924" text-anchor="start" font-size="17" fill="#B8421A" font-weight="bold">IF/ID: 65 bits</text>
<text x="42" y="950" text-anchor="start" font-size="14" fill="#14213D">valid 1 · pc 32 · instr 32</text>
<rect x="440" y="898" width="440" height="118" rx="8" fill="#FCE3D6" stroke="#B8421A" stroke-width="2"/>
<text x="452" y="924" text-anchor="start" font-size="17" fill="#B8421A" font-weight="bold">ID/EX: 143 bits</text>
<text x="452" y="950" text-anchor="start" font-size="14" fill="#14213D">valid 1 · pc_plus4 32 · rs_value 32 · rt_value 32 ·</text>
<text x="452" y="971" text-anchor="start" font-size="14" fill="#14213D">imm 32 · alu_op 3 · use_imm 1 · is_lw 1 · is_sw 1 ·</text>
<text x="452" y="992" text-anchor="start" font-size="14" fill="#14213D">is_beq 1 · is_break 1 · wb_enable 1 · wb_addr 5</text>
<rect x="900" y="898" width="390" height="118" rx="8" fill="#FCE3D6" stroke="#B8421A" stroke-width="2"/>
<text x="912" y="924" text-anchor="start" font-size="17" fill="#B8421A" font-weight="bold">EX/MEM: 74 bits</text>
<text x="912" y="950" text-anchor="start" font-size="14" fill="#14213D">valid 1 · alu_result 32 · store_data 32 ·</text>
<text x="912" y="971" text-anchor="start" font-size="14" fill="#14213D">is_lw 1 · is_sw 1 · is_break 1 · wb_enable 1</text>
<text x="912" y="992" text-anchor="start" font-size="14" fill="#14213D">· wb_addr 5</text>
<rect x="1310" y="898" width="390" height="118" rx="8" fill="#FCE3D6" stroke="#B8421A" stroke-width="2"/>
<text x="1322" y="924" text-anchor="start" font-size="17" fill="#B8421A" font-weight="bold">MEM/WB: 40 bits</text>
<text x="1322" y="950" text-anchor="start" font-size="14" fill="#14213D">valid 1 · wb_enable 1 · wb_addr 5 · wb_data</text>
<text x="1322" y="971" text-anchor="start" font-size="14" fill="#14213D">32 · is_break 1</text>
