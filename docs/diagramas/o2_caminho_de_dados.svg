<path d="M1130,540 L1180,540" fill="none" stroke="#14213D" stroke-width="2" marker-end="url(#ah)"/>
<rect x="1335" y="360" width="40" height="110" rx="8" fill="#FFFFFF" stroke="#14213D" stroke-width="2"/>
<text x="1355.0" y="410.7" text-anchor="middle" font-size="12" fill="#14213D">mux</text>
<text x="1355.0" y="427.7" text-anchor="middle" font-size="12" fill="#14213D">is_lw</text>
<path d="M1130,300 L1355,300 L1355,360" fill="none" stroke="#14213D" stroke-width="2" marker-end="url(#ah)"/>
<text x="1240" y="292" text-anchor="middle" font-size="13" fill="#14213D">alu_result</text>
<path d="M1310,440 L1335,440" fill="none" stroke="#14213D" stroke-width="2" marker-end="url(#ah)"/>
<path d="M1375,415 L1400,415" fill="none" stroke="#14213D" stroke-width="2" marker-end="url(#ah)"/>
<rect x="1470" y="380" width="190" height="70" rx="8" fill="#DCE9FA" stroke="#1F5FB0" stroke-width="2"/>
<text x="1565.0" y="410.4" text-anchor="middle" font-size="14" fill="#14213D">Escrita no banco</text>
<text x="1565.0" y="429.4" text-anchor="middle" font-size="14" fill="#14213D">wb_enable ∧ valid</text>
