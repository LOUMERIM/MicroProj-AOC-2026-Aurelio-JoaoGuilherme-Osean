<text x="1555" y="692" text-anchor="end" font-size="13" fill="#B8421A">escrita na 1ª metade do ciclo (descida)</text>
<path d="M720,125 L1700,125" fill="none" stroke="#8A8F98" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#ah)"/>
<text x="740" y="118" text-anchor="start" font-size="12" fill="#555" font-style="italic">controles</text>
<text x="30" y="590" text-anchor="start" font-size="12" fill="#555" font-style="italic">valid e os controles (is_lw, is_sw,</text>
<text x="30" y="607" text-anchor="start" font-size="12" fill="#555" font-style="italic">is_beq, is_break, wb_enable, wb_addr)</text>
<text x="30" y="624" text-anchor="start" font-size="12" fill="#555" font-style="italic">acompanham a instrução até WB</text>
<text x="30" y="641" text-anchor="start" font-size="12" fill="#555" font-style="italic">(linha tracejada cinza).</text>
<text x="30" y="658" text-anchor="start" font-size="12" fill="#555" font-style="italic"></text>
<text x="30" y="675" text-anchor="start" font-size="12" fill="#555" font-style="italic">Distância 3: o banco escreve</text>
<text x="30" y="692" text-anchor="start" font-size="12" fill="#555" font-style="italic">antes de a consumidora ler.</text>
<rect x="560" y="745" width="700" height="80" rx="8" fill="#FFF1F0" stroke="#C62828" stroke-width="2"/>
<text x="910.0" y="780.1" text-anchor="middle" font-size="16" font-weight="bold" fill="#14213D">Unidade de detecção de conflitos (hazard_*)</text>
<text x="910.0" y="801.1" text-anchor="middle" font-size="16" fill="#14213D">dados · estrutural · controle → aborto</text>
