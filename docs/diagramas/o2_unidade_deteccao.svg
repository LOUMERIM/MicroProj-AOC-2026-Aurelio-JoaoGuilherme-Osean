<text x="1040" y="657" text-anchor="middle" font-size="11" fill="#C62828">control_conflict</text>
<text x="1340" y="210" text-anchor="start" font-size="16" fill="#14213D" font-weight="bold">Saídas (R3)</text>
<rect x="1340" y="235" width="200" height="80" rx="8" fill="#FFFFFF" stroke="#14213D" stroke-width="2"/>
<text x="1440.0" y="270.4" text-anchor="middle" font-size="14" font-weight="bold" fill="#14213D">hazard_abort</text>
<text x="1440.0" y="289.4" text-anchor="middle" font-size="14" fill="#14213D">1 bit</text>
<path d="M1280,275 L1340,275" fill="none" stroke="#C62828" stroke-width="2" marker-end="url(#ad)"/>
<rect x="1340" y="345" width="200" height="80" rx="8" fill="#FFFFFF" stroke="#14213D" stroke-width="2"/>
