<text x="1440.0" y="399.4" text-anchor="middle" font-size="14" fill="#14213D">2 bits: 01 · 10 · 11</text>
<path d="M1280,385 L1340,385" fill="none" stroke="#C62828" stroke-width="2" marker-end="url(#ad)"/>
<rect x="1340" y="455" width="200" height="80" rx="8" fill="#FFFFFF" stroke="#14213D" stroke-width="2"/>
<text x="1440.0" y="490.4" text-anchor="middle" font-size="14" font-weight="bold" fill="#14213D">hazard_pc</text>
<text x="1440.0" y="509.4" text-anchor="middle" font-size="14" fill="#14213D">32 bits</text>
<path d="M1280,495 L1340,495" fill="none" stroke="#C62828" stroke-width="2" marker-end="url(#ad)"/>
<rect x="1340" y="565" width="200" height="80" rx="8" fill="#FFFFFF" stroke="#14213D" stroke-width="2"/>
<text x="1440.0" y="600.4" text-anchor="middle" font-size="14" font-weight="bold" fill="#14213D">hazard_cycle</text>
<text x="1440.0" y="619.4" text-anchor="middle" font-size="14" fill="#14213D">32 bits</text>
<path d="M1280,605 L1340,605" fill="none" stroke="#C62828" stroke-width="2" marker-end="url(#ad)"/>
<text x="1340" y="690" text-anchor="start" font-size="12" fill="#555" font-style="italic">hazard_pc: a consumidora (dados), a</text>
<text x="1340" y="707" text-anchor="start" font-size="12" fill="#555" font-style="italic">instrução em IF (estrutural) ou o beq</text>
<text x="1340" y="724" text-anchor="start" font-size="12" fill="#555" font-style="italic">(controle).</text>
<text x="1340" y="745" text-anchor="start" font-size="12" fill="#555" font-style="italic">hazard_cycle = cycle_cnt + 1 até congelar.</text>
<rect x="560" y="790" width="720" height="60" rx="8" fill="#FFF1F0" stroke="#C62828" stroke-width="2"/>
<text x="920.0" y="815.4" text-anchor="middle" font-size="14" fill="#14213D">frozen = 1: PC, registradores entre estágios, banco de registradores e</text>
<text x="920.0" y="834.4" text-anchor="middle" font-size="14" fill="#14213D">memória param; hazard_* ficam estáveis até o reset</text>
