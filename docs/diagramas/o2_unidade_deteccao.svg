<circle cx="400" cy="300" r="4" fill="#14213D"/>
<path d="M400,640 L560,640" fill="none" stroke="#14213D" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="480.0" y="635" text-anchor="middle" font-size="13" fill="#14213D">valid, is_beq</text>
<circle cx="400" cy="640" r="4" fill="#14213D"/>
<path d="M360,425 L420,425" fill="none" stroke="#14213D" stroke-width="1.8"/>
<path d="M420,350 L420,495" fill="none" stroke="#14213D" stroke-width="1.8"/>
<path d="M420,350 L560,350" fill="none" stroke="#14213D" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="490.0" y="345" text-anchor="middle" font-size="13" fill="#14213D">dist. 2</text>
<circle cx="420" cy="350" r="4" fill="#14213D"/>
<path d="M420,495 L560,495" fill="none" stroke="#14213D" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="490.0" y="490" text-anchor="middle" font-size="13" fill="#14213D">valid, lw/sw</text>
<circle cx="420" cy="495" r="4" fill="#14213D"/>
<path d="M360,545 L440,545" fill="none" stroke="#14213D" stroke-width="1.8"/>
<path d="M440,545 L440,670" fill="none" stroke="#14213D" stroke-width="1.8"/>
