<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880" font-family="DejaVu Sans, Inter, Arial, sans-serif" font-size="15">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14213D"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B8421A"/></marker><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C62828"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="24" y="30" font-size="21" font-weight="bold" fill="#14213D">Unidade de detecção de conflitos da O2 — entradas, blocos e saídas</text>
<text x="30" y="62" text-anchor="start" font-size="16" fill="#14213D" font-weight="bold">Entradas (registradores entre estágios)</text>
<rect x="30" y="75" width="330" height="135" rx="8" fill="#FCE3D6" stroke="#B8421A" stroke-width="2"/>
<text x="195.0" y="128.4" text-anchor="middle" font-size="14" font-weight="bold" fill="#14213D">IF/ID</text>
<text x="195.0" y="147.4" text-anchor="middle" font-size="14" fill="#14213D">valid · instr[31:26] opcode</text>
<text x="195.0" y="166.4" text-anchor="middle" font-size="14" fill="#14213D">instr[25:21] = rs · instr[20:16] = rt</text>
<rect x="30" y="230" width="330" height="110" rx="8" fill="#FCE3D6" stroke="#B8421A" stroke-width="2"/>
<text x="195.0" y="270.9" text-anchor="middle" font-size="14" font-weight="bold" fill="#14213D">ID/EX</text>
<text x="195.0" y="289.9" text-anchor="middle" font-size="14" fill="#14213D">valid · wb_enable · wb_addr[4:0]</text>
<text x="195.0" y="308.9" text-anchor="middle" font-size="14" fill="#14213D">is_beq</text>
<rect x="30" y="360" width="330" height="130" rx="8" fill="#FCE3D6" stroke="#B8421A" stroke-width="2"/>
<text x="195.0" y="410.9" text-anchor="middle" font-size="14" font-weight="bold" fill="#14213D">EX/MEM</text>
<text x="195.0" y="429.9" text-anchor="middle" font-size="14" fill="#14213D">valid · wb_enable · wb_addr[4:0]</text>
<text x="195.0" y="448.9" text-anchor="middle" font-size="14" fill="#14213D">is_lw · is_sw</text>
<rect x="30" y="510" width="330" height="70" rx="8" fill="#E4F1E4" stroke="#2E7D32" stroke-width="2"/>
<text x="195.0" y="540.4" text-anchor="middle" font-size="14" font-weight="bold" fill="#14213D">ULA (estágio EX)</text>
<text x="195.0" y="559.4" text-anchor="middle" font-size="14" fill="#14213D">alu_zero  (rs − rt = 0)</text>
<rect x="30" y="600" width="330" height="120" rx="8" fill="#FFFFFF" stroke="#14213D" stroke-width="2"/>
<text x="195.0" y="645.9" text-anchor="middle" font-size="14" font-weight="bold" fill="#14213D">IF (busca)</text>
<text x="195.0" y="664.9" text-anchor="middle" font-size="14" fill="#14213D">fetch_valid_now = stream_active ∧ ¬frozen</text>
<text x="195.0" y="683.9" text-anchor="middle" font-size="14" fill="#14213D">∧ ¬(break em ID) · generic MEM_UNIFICADA</text>
<rect x="560" y="75" width="420" height="120" rx="8" fill="#F3ECCB" stroke="#8A6D00" stroke-width="2"/>
<text x="770.0" y="120.9" text-anchor="middle" font-size="14" font-weight="bold" fill="#14213D">Uso de operandos: id_uses_rs / id_uses_rt</text>
<text x="770.0" y="139.9" text-anchor="middle" font-size="14" fill="#14213D">tipo R (≠ break): rs e rt</text>
<text x="770.0" y="158.9" text-anchor="middle" font-size="14" fill="#14213D">addi, lw: só rs · sw, beq: rs e rt</text>
<rect x="560" y="215" width="420" height="230" rx="8" fill="#FFF1F0" stroke="#C62828" stroke-width="2"/>
<text x="770.0" y="287.4" text-anchor="middle" font-size="14" font-weight="bold" fill="#14213D">Conflito de DADOS (tipo 01)</text>
<text x="770.0" y="306.4" text-anchor="middle" font-size="14" fill="#14213D">hit: produtora válida (wb_enable = 1,</text>
<text x="770.0" y="325.4" text-anchor="middle" font-size="14" fill="#14213D">wb_addr ≠ $zero) em distância 1 (ID/EX) ou</text>
<text x="770.0" y="344.4" text-anchor="middle" font-size="14" fill="#14213D">distância 2 (EX/MEM) e (usa rs ∧ rs = wb_addr)</text>
<text x="770.0" y="363.4" text-anchor="middle" font-size="14" fill="#14213D">ou (usa rt ∧ rt = wb_addr)</text>
<text x="770.0" y="382.4" text-anchor="middle" font-size="14" fill="#14213D">data_conflict = hit ∧ ¬frozen ∧ ¬branch_taken</text>
<rect x="560" y="465" width="420" height="100" rx="8" fill="#FFF1F0" stroke="#C62828" stroke-width="2"/>
<text x="770.0" y="500.9" text-anchor="middle" font-size="14" font-weight="bold" fill="#14213D">Conflito ESTRUTURAL (tipo 10)</text>
<text x="770.0" y="519.9" text-anchor="middle" font-size="14" fill="#14213D">MEM_UNIFICADA ∧ fetch_valid_now ∧</text>
<text x="770.0" y="538.9" text-anchor="middle" font-size="14" fill="#14213D">EX/MEM.valid ∧ (is_lw ∨ is_sw)  →  structural_conflict</text>
<rect x="560" y="585" width="420" height="160" rx="8" fill="#FFF1F0" stroke="#C62828" stroke-width="2"/>
<text x="770.0" y="631.9" text-anchor="middle" font-size="14" font-weight="bold" fill="#14213D">Conflito de CONTROLE (tipo 11)</text>
<text x="770.0" y="650.9" text-anchor="middle" font-size="14" fill="#14213D">branch_taken = ID/EX.valid ∧ is_beq ∧ alu_zero</text>
<text x="770.0" y="669.9" text-anchor="middle" font-size="14" fill="#14213D">control_conflict = branch_taken ∧ ¬frozen ∧</text>
<text x="770.0" y="688.9" text-anchor="middle" font-size="14" fill="#14213D">(IF/ID.valid ∨ fetch_valid_now)</text>
<text x="770.0" y="707.9" text-anchor="middle" font-size="14" fill="#14213D">branch_pc = pc_plus4 − 4</text>
<path d="M750,195 L750,215" fill="none" stroke="#14213D" stroke-width="2" marker-end="url(#ah)"/>
<text x="796" y="210" text-anchor="middle" font-size="13" fill="#14213D">usa rs/rt</text>
