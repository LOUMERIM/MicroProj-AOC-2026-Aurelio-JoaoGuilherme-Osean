<text x="1190.0" y="389.9" text-anchor="middle" font-size="14" font-weight="bold" fill="#14213D">Prioridade</text>
<text x="1190.0" y="408.9" text-anchor="middle" font-size="14" font-weight="bold" fill="#14213D">e aborto</text>
<text x="1190.0" y="427.9" text-anchor="middle" font-size="14" fill="#14213D"></text>
<text x="1190.0" y="446.9" text-anchor="middle" font-size="14" fill="#14213D">controle (EX)</text>
<text x="1190.0" y="465.9" text-anchor="middle" font-size="14" fill="#14213D">&gt; dados (ID)</text>
<text x="1190.0" y="484.9" text-anchor="middle" font-size="14" fill="#14213D">&gt; estrutural (IF)</text>
<text x="1190.0" y="503.9" text-anchor="middle" font-size="14" fill="#14213D"></text>
<text x="1190.0" y="522.9" text-anchor="middle" font-size="14" fill="#14213D">frozen ← 1</text>
<text x="1190.0" y="541.9" text-anchor="middle" font-size="14" fill="#14213D">hazard_type_reg</text>
<text x="1190.0" y="560.9" text-anchor="middle" font-size="14" fill="#14213D">hazard_pc_reg</text>
<text x="1190.0" y="579.9" text-anchor="middle" font-size="14" fill="#14213D">cycle_cnt</text>
